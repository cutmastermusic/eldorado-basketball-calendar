name: Update basketball schedule

on:
  schedule:
    # Every day at 6:00 AM Mountain Time (13:00 UTC in winter, 12:00 in summer;
    # we just run at 13:00 UTC year-round — exact hour doesn't matter)
    - cron: "0 13 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests cloudscraper

      # Varsity keeps the original schedule.ics name so existing subscribers keep working
      - name: Generate varsity schedule.ics
        run: python maxpreps_to_ics.py

      - name: Generate JV schedule-jv.ics
        if: always()
        env:
          MAXPREPS_URL: https://www.maxpreps.com/nm/albuquerque/eldorado-golden-eagles/basketball/jv/schedule/
          CALENDAR_NAME: Eldorado JV Basketball
          TEAM_LABEL: Eldorado JV
          OUTPUT_FILE: schedule-jv.ics
        run: python maxpreps_to_ics.py

      - name: Generate freshman schedule-freshman.ics
        if: always()
        env:
          MAXPREPS_URL: https://www.maxpreps.com/nm/albuquerque/eldorado-golden-eagles/basketball/freshman/schedule/
          CALENDAR_NAME: Eldorado Freshman Basketball
          TEAM_LABEL: Eldorado Freshman
          OUTPUT_FILE: schedule-freshman.ics
        run: python maxpreps_to_ics.py

      - name: Commit if changed
        if: always()
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add schedule*.ics
          if git diff --cached --quiet; then
            echo "No schedule changes today."
          else
            git commit -m "Update schedule $(date -u +%Y-%m-%d)"
            git push
          fi
